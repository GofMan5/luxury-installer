[alias]
quick = "test -p luxury-spec -p luxury-bundle -p luxury-engine -p luxury-platform -p luxury-system-roots -p luxury-compiler -p luxury-macos-trust -p luxury-process -p luxury-windows-trust -p luxury -p xtask"
core-check = "check --workspace"
gui-check = "run --locked -p xtask -- gui-check"
tauri-test = "test --locked --manifest-path apps/luxury-installer/src-tauri/Cargo.toml"
tauri-clippy = "clippy --locked --manifest-path apps/luxury-installer/src-tauri/Cargo.toml --all-targets -- -D warnings"
full-test = "test --workspace --all-targets"
ci = "run --locked -p xtask -- ci"
dist = "run --locked -p xtask -- dist"
runner-smoke = "run --locked -p xtask -- runner-smoke"
studio-assemble = "run --locked -p xtask -- studio-assemble"
project-installer = "run --locked -p xtask -- project-installer"
assemble = "run --locked -p xtask -- assemble"
linux-packages = "run --locked -p xtask -- linux-packages"
macos-dmg = "run --locked -p xtask -- macos-dmg"
windows-setup = "run --locked -p xtask -- windows-setup"
windows-release-setup = "run --locked -p xtask -- windows-release-setup"
verify-windows-signers = "run --locked -p xtask -- verify-authenticode-pair"
verify-windows-release = "run --locked -p xtask -- verify-windows-release"
verify-macos-release = "run --locked -p xtask -- verify-macos-release"
verify-macos-dmg = "run --locked -p xtask -- verify-macos-dmg"
