name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path apps/luxury-installer/src-tauri/Cargo.toml -- --check

  core:
    name: Rust / quick
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo quick --locked

  windows-boundary:
    name: Windows / trust + filesystem boundary
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --locked -p luxury-windows-trust -p luxury-platform -p luxury-system-roots -p luxury-process

  gui:
    name: Tauri / React / TypeScript
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.26.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: apps/luxury-installer/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            apps/luxury-installer/src-tauri -> target
      - run: pnpm --dir apps/luxury-installer install --frozen-lockfile
      - run: cargo gui-check

  cross-platform:
    name: Full / ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux-X64
            evidence: linux-x86_64.json
            studio_path: dist/luxury-installer-studio-*-linux-x86_64.tar.gz
          - os: windows-latest
            label: Windows-X64
            evidence: windows-x86_64.json
            studio_path: dist/luxury-installer-studio-*-windows-x86_64
          - os: macos-latest
            label: macOS-ARM64
            evidence: macos-aarch64.json
            studio_path: dist/luxury-installer-studio-*-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'macOS'
        name: Use a non-symlinked macOS temporary root
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb xauth rpm cpio
      - if: runner.os == 'Linux'
        name: Keep headless GTK verification stderr clean
        run: echo "NO_AT_BRIDGE=1" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.26.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: apps/luxury-installer/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            apps/luxury-installer/src-tauri -> target
      - run: pnpm --dir apps/luxury-installer install --frozen-lockfile
      - run: cargo full-test --locked
      - run: cargo tauri-test
      - if: runner.os == 'Linux'
        name: Test standalone Rust Linux containers
        run: cargo test --locked -p xtask --features standalone-linux-packager runner::linux_container::tests::standalone_rust_containers_round_trip_without_system_package_tools -- --exact
      - if: runner.os == 'Linux'
        run: xvfb-run -a cargo studio-assemble
      - if: runner.os != 'Linux'
        run: cargo studio-assemble
      - name: Upload verified Studio artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ matrix.label }}
          path: ${{ matrix.studio_path }}
          if-no-files-found: error
          retention-days: 14
      - if: runner.os == 'Windows'
        name: Build a standalone Windows installer with packaged Studio
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'native-project'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'native-output'
          New-Item -ItemType Directory -Path $outputRoot | Out-Null
          cargo run --locked -p luxury -- init $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $studio = Get-ChildItem dist -Directory -Filter 'luxury-installer-studio-*-windows-x86_64' | Select-Object -First 1
          if (-not $studio) { throw 'packaged Windows Studio was not found' }
          $packager = Join-Path $studio.FullName 'packager\luxury-packager.exe'
          Push-Location $env:RUNNER_TEMP
          try {
            $env:CARGO = 'missing-cargo'
            $env:PNPM = 'missing-pnpm'
            $env:RUSTC = 'missing-rustc'
            & $packager project-installer $project (Join-Path $outputRoot 'Setup.exe')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - if: runner.os != 'Windows'
        name: Build a native installer with packaged Studio
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/native-project"
          output_root="$RUNNER_TEMP/native-output"
          mkdir -p "$output_root"
          cargo run --locked -p luxury -- init "$project"
          if [ "$RUNNER_OS" = 'Linux' ]; then
            setup_template="$(find dist -type f -path '*/templates/linux-x86_64/usr/bin/luxury-installer' -print -quit)"
            test -n "$setup_template"
            env -u DISPLAY "$setup_template" --help | grep -Fq -- '--unattended-install'
            packager="$(find dist -type f -path '*/usr/lib/Luxury Installer/packager/luxury-packager' -print -quit)"
            test -n "$packager"
            packager="$(cd "$(dirname "$packager")" && pwd -P)/$(basename "$packager")"
            (cd "$RUNNER_TEMP" && xvfb-run -a /usr/bin/env PATH=/missing CARGO=/missing/cargo PNPM=/missing/pnpm RUSTC=/missing/rustc "$packager" project-installer "$project" "$output_root/installers")
          else
            packager="$(find dist -type f -path '*/Contents/Resources/packager/luxury-packager' -print -quit)"
            test -n "$packager"
            packager="$(cd "$(dirname "$packager")" && pwd -P)/$(basename "$packager")"
            (cd "$RUNNER_TEMP" && CARGO=/missing/cargo PNPM=/missing/pnpm RUSTC=/missing/rustc "$packager" project-installer "$project" "$output_root/Setup.dmg")
          fi
      - name: Upload verified native installer output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-installer-${{ matrix.label }}
          path: ${{ runner.temp }}/native-output/**
          if-no-files-found: error
          retention-days: 14
      - if: runner.os == 'Linux'
        name: Build and inspect native Linux development packages
        run: |
          ./target/x86_64-unknown-linux-gnu/dist/luxury init target/linux-package-project
          ./target/x86_64-unknown-linux-gnu/dist/luxury build target/linux-package-project target/linux-package-smoke.luxpkg
          xvfb-run -a cargo linux-packages -- target/linux-package-smoke.luxpkg
      - if: runner.os == 'Linux'
        name: Upload inspected Linux development packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-native-packages-development-${{ matrix.label }}
          path: target/linux-packages/**
          if-no-files-found: error
          retention-days: 14
      - if: runner.os == 'Linux'
        run: xvfb-run -a cargo runner-smoke
      - if: runner.os != 'Linux'
        run: cargo runner-smoke
      - name: Upload lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-lifecycle-${{ matrix.label }}
          path: target/runner-evidence/${{ matrix.evidence }}
          if-no-files-found: error
          retention-days: 14

  evidence-set:
    name: Verify lifecycle evidence set
    if: github.event_name == 'workflow_dispatch'
    needs: cross-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runner-lifecycle-*
          path: runner-evidence
          merge-multiple: true
      - run: cargo run --locked -p xtask -- verify-evidence-set runner-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-runner-lifecycle-evidence-v2
          path: runner-evidence
          if-no-files-found: error
          retention-days: 14
