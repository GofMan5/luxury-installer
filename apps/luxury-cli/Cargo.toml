[package]
name = "luxury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
luxury-bundle.workspace = true
luxury-compiler.workspace = true
luxury-engine.workspace = true
luxury-platform.workspace = true
luxury-spec.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
luxury-windows-trust.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
luxury-macos-trust.workspace = true
rustix = { workspace = true, features = ["net"] }

[dev-dependencies]
tempfile.workspace = true
